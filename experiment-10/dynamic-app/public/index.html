<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daksh Kasana — Dynamic Feedback</title></head><body style="font-family:Arial;max-width:620px;margin:40px auto;padding:20px"><h1>Dynamic Feedback App</h1><p>Experiment 10 · Daksh Kasana</p><form id="f"><label>Name <input id="name" required></label><p><label>Feedback <textarea id="message" required></textarea></label></p><button>Submit</button></form><p id="result"></p><p><a href="/health">Health check</a> · <a href="/feedback">View feedback JSON</a></p><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,message:document.getElementById('message').value})});const d=await r.json();document.getElementById('result').textContent=d.message;};</script></body></html>
